upstream django_api {
    server api:8000;
    keepalive 16;
}

map $http_x_forwarded_proto $proxy_proto {
    default $scheme;
    https   https;
}

server {
    listen 80;
    server_name _;

    resolver 127.0.0.11 ipv6=off valid=10s;

    # Nothing large is ever uploaded: models, issue sets and specifications
    # stay in the browser (frontend/AGENTS.md §1). The only request bodies are
    # auth, project metadata and an RFC 3161 timestamp request carrying a
    # hash. A small limit is a cheap second line of defence — if this ever
    # needs raising, ask what is being uploaded before raising it.
    client_max_body_size 2m;

     # Allow your dev origins
    set $cors_origin "";
    if ($http_origin ~* ^https?://(localhost:3000|127\.0\.0\.1:3000|localhost)$) {
        set $cors_origin $http_origin;
    }

    # --- Next.js frontend (everything else) ---
    location / {
        # Cross-origin isolation, so the IFC/geometry WASM workers can use
        # SharedArrayBuffer. `credentialless` avoids having to stamp CORP on
        # every same-origin subresource.
        #
        # Next also sets these in next.config.ts for `next dev`, which does not
        # go through nginx. Keep the two in sync — a mismatch shows up as
        # "SharedArrayBuffer is not defined" only in one environment.
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Embedder-Policy "credentialless" always;
        add_header Cross-Origin-Resource-Policy "same-origin" always;

        # NO Content-Security-Policy here. The app sets its own in
        # frontend/proxy.ts, with a per-request nonce that Next stamps onto its
        # inline bootstrap scripts. Two CSP headers are enforced as their
        # INTERSECTION, so a second nonce-less policy would block those scripts
        # and the app would render but never hydrate — silently, because the
        # server-rendered HTML still looks correct.
        #
        # If nginx ever needs to own the CSP, it has to mint the nonce too and
        # pass it through; see the "Adding a nonce with Proxy" section of the
        # Next.js CSP guide.

        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), usb=(), serial=()" always;

        set $frontend_upstream http://frontend:3000;
        proxy_pass         $frontend_upstream;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection "upgrade";
        # Keep the port in the host so Next.js Server Actions' Origin check
        # (Origin vs X-Forwarded-Host) passes behind the proxy.
        proxy_set_header   Host $http_host;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Host $http_host;
        proxy_set_header   X-Forwarded-Proto $proxy_proto;
    }



    # Internal location used by X-Accel-Redirect
    location /protected_media/ {
        internal;
        alias /vol/media/;

        # Add CORS on the final file response
        add_header Access-Control-Allow-Origin $cors_origin always;
        add_header Access-Control-Allow-Credentials "true" always;
        add_header Access-Control-Expose-Headers "Content-Disposition" always;
    }



    # Public STATIC (collected into /app/staticfiles)
    location /static/ {
        alias /vol/static/;
        access_log off;
        expires 7d;
        add_header Cache-Control "public";
    }

    # Never expose /media directly if you keep sensitive files there
    location /media/ {
        deny all;
    }

    # --- Django API + admin + static/media are served under /api and /static /media ---
    location /api/ {
        # Variable in proxy_pass forces runtime DNS resolution (see resolver
        # above), so a temporarily-down api doesn't crash nginx at startup.
        set $api_upstream http://api:8000;
        proxy_pass         $api_upstream;
        proxy_http_version 1.1;
        # $http_host preserves the port (e.g. localhost:9980). Next.js rejects
        # Server Actions when X-Forwarded-Host doesn't match the Origin, and
        # $host drops the port.
        proxy_set_header   Host $http_host;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Host $http_host;
        proxy_set_header   X-Forwarded-Proto $proxy_proto;
    }

    location /flower/ {
        proxy_pass http://flower:5555;  # <-- keep the trailing /flower/
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host $host;                 # important for correct URLs
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 300;
    }
   

}