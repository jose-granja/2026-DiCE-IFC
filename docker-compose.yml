# Production: the Next.js front end and the texture library behind nginx.
# Models, issues and specifications are processed in the browser; the front
# end's own server only serves pages and proxies bSDD, and the texture library
# (backend/, ADR 016) only lists and serves textures (frontend/AGENTS.md §1).
services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
      # NEXT_PUBLIC_* is inlined by Next at build time, so these must be build
      # args. `env_file` below applies at runtime only and arrives far too late
      # — which is why the basemap was missing from every built image.
      args:
        NEXT_PUBLIC_TILE_ORIGIN: ${NEXT_PUBLIC_TILE_ORIGIN:-}
        NEXT_PUBLIC_MAP_STYLE_URL: ${NEXT_PUBLIC_MAP_STYLE_URL:-}
        NEXT_PUBLIC_CESIUM_ION_TOKEN: ${NEXT_PUBLIC_CESIUM_ION_TOKEN:-}
        NEXT_PUBLIC_CESIUM_ION_ASSET_ID: ${NEXT_PUBLIC_CESIUM_ION_ASSET_ID:-}
        NEXT_PUBLIC_SIGNING_PROVIDER: ${NEXT_PUBLIC_SIGNING_PROVIDER:-companion}
        NEXT_PUBLIC_OPERATOR_NAME: ${NEXT_PUBLIC_OPERATOR_NAME:-}
        NEXT_PUBLIC_OPERATOR_CONTACT: ${NEXT_PUBLIC_OPERATOR_CONTACT:-}
        NEXT_PUBLIC_SOURCE_URL: ${NEXT_PUBLIC_SOURCE_URL:-}
    env_file:
      - stack.env
    expose:
      - "3000"
    restart: unless-stopped

  # The texture library: curated CC0 textures for realistic materials. Empty
  # until built once — see README, "Texture library".
  backend:
    build:
      context: ./backend
    # nginx addresses it as `backend` (nginx/nginx.conf), which the default
    # DJANGO_ALLOWED_HOSTS accepts: no domain to configure here.
    env_file:
      - stack.env
    volumes:
      - texture-library:/srv/texture-library
      - texture-cache:/srv/texture-cache
      - texture-data:/srv/texture-data
    expose:
      - "8000"
    restart: unless-stopped

  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    depends_on:
      - frontend
      - backend
    volumes:
      # The library's files, served straight from disk and cached for good.
      - texture-library:/srv/texture-library:ro
    ports:
      - "9881:80"
    restart: unless-stopped

volumes:
  texture-library:
  texture-cache:
  texture-data:
