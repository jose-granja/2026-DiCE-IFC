{% extends "admin/change_list.html" %}
{% comment %}
  "Update from bSDD": reads the IFC dictionary's property names again, in
  every language in PROPERTY_NAME_LANGUAGES (ADR 017).
{% endcomment %}
{% block object-tools-items %}
  <li>
    <form method="post" action="{% url 'admin:dictionary_propertyname_refresh' %}" style="display:inline">
      {% csrf_token %}
      <button type="submit" class="button" style="padding:4px 12px;border-radius:15px;font-size:0.6875rem;font-weight:400;text-transform:uppercase;letter-spacing:0.5px"
        title="Read the property names in {{ property_name_languages }} from the buildingSMART Data Dictionary">Update from bSDD</button>
    </form>
  </li>
  {{ block.super }}
{% endblock %}
