[project]
name = "api"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "jose-granja", email = "78562236+jose-granja@users.noreply.github.com" }
]
requires-python = ">=3.14"
dependencies = [
    "django>=6.0.8",
    "django-celery-beat>=2.9.0",
    "django-cors-headers>=4.9.0",
    "django-crontab>=0.7.1",
    "django-debug-toolbar>=7.0.0",
    "django-filter>=26.1",
    "django-import-export>=4.4.1",
    "django-redis>=7.0.0",
    "django-simple-history>=3.13.0",
    "django-unfold>=0.102.0",
    "djangorestframework>=3.17.2",
    "djangorestframework-api-key>=3.1.0",
    "djangorestframework-simplejwt>=5.5.1",
    "djoser>=2.3.4",
    "drf-spectacular>=0.30.0",
    "whitenoise>=6.12.0",
    # Runtime dependencies the compose commands assume but the lockfile was
    # missing: settings.py defaults to django.db.backends.postgresql, the prod
    # command runs gunicorn, and docker-compose.yml runs a flower service.
    "psycopg[binary]>=3.2.0",
    "gunicorn>=23.0.0",
    "flower>=2.0.1",
]

[project.scripts]
api = "api:main"

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"
