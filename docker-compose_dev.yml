version: '0.1'
services:
  api:
    build: 
      context: ./api
      dockerfile: Dockerfile
    # Migrate before serving. Without this a fresh stack starts against an
    # empty Postgres: the API 500s on its first real query and celery-beat
    # exits outright ("relation django_celery_beat_crontabschedule does not
    # exist"). The prod compose already migrates in its command.
    command: >
      sh -c "
      python manage.py migrate --noinput &&
      python manage.py runserver 0.0.0.0:8000
      "
    ports:
      - 8000:8000
    expose:
      - "8000"
    depends_on:
      - postgres
      - redis
    restart: unless-stopped
    env_file:
      - ./.env.dev
    volumes:
      - ./api:/app
      - /app/.venv
      - static_volume:/app/staticfiles
      - media_volume:/app/media
      - logs_volume:/vol 
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    environment:
      PORT: 3000
    env_file:
      - ./.env.dev
    expose:
      - "3000"
    ports:
      - 3000:3000
    volumes:
      - ./frontend:/app
      - /app/node_modules
    # Reconcile node_modules against package.json on every start.
    #
    # `/app/node_modules` is an anonymous volume, so it survives `up --build`
    # and keeps whatever was installed the first time this container was
    # created. Add a dependency on the host and the container never sees it:
    # the bind mount shows it the new source and the new package.json, while
    # the volume still holds the old modules. The result is
    # "Module not found: <package>" for a package that is plainly in
    # package.json — which cost a debugging round for `3d-tiles-renderer`.
    #
    # `npm install` is a no-op when nothing changed, so this costs a second at
    # start and removes a whole class of confusing failure.
    command: sh -c "npm install --no-audit --no-fund && npm run dev -- --hostname 0.0.0.0"
    depends_on:
      - api
  nginx:
    image: nginx:1.25-alpine
    depends_on:
      - frontend
      - api
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - static_volume:/vol/static:ro
      - media_volume:/vol/media:ro
  postgres:
    image: postgres:16-alpine
    ports:
      - 5432:5432
    env_file:
      - ./.env.dev
    volumes:
      - postgres_data:/var/lib/postgresql/data/
  redis:
    image: redis:6.2-alpine
    command: --port 6379
    expose:
      - "6379"
    ports:
      - 6379:6379
    restart: always
    volumes:
      - ./api:/app
      - /app/.venv
  celery:
    build: ./api
    restart: unless-stopped
    command: celery -A dicecde worker --loglevel=info
    depends_on:
      - postgres
      - redis
      - api
    env_file:
      - ./.env.dev
    volumes:
      - ./api:/app
      - /app/.venv
      - media_volume:/app/media
  celery-beat:
    build: ./api
    restart: unless-stopped
    command: celery -A dicecde beat --loglevel=info --scheduler django_celery_beat.schedulers:DatabaseScheduler
    depends_on:
      - postgres
      - redis
      - api
    env_file:
      - ./.env.dev
    volumes:
      - ./api:/app
      - /app/.venv
  flower:
    build: ./api
    restart: unless-stopped
    # nginx proxies /flower/ without stripping the prefix, so flower has to
    # know it is mounted there or every request 404s. The prod compose already
    # passes this.
    command: celery -A dicecde flower --address=0.0.0.0 --port=5555 --url_prefix=/flower
    depends_on:
      - api
      - redis
      - celery
    env_file:
      - ./.env.dev
    expose:
      - "5555"
    ports:
      - 5555:5555
volumes:
  postgres_data:
  static_volume:
  media_volume:
  logs_volume: